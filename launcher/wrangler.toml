# Tin Tanks launcher — a Cloudflare Worker that holds the Gameye API token,
# finds a match with a free slot (or starts one) and sends the player to it.
#
#   npx wrangler deploy                       # from this directory
#   npx wrangler secret put GAMEYE_API_TOKEN  # once per environment
name = "tin-tanks-launcher"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "6fe01292662c1234adaf972a1a621d14"   # Gameye

[vars]
MODE = "matchmaker"
MM_URL = "https://tin-tanks-rooms.gameye.workers.dev"
MM_TENANT = "tin-tanks"
MM_PLAYLIST = "ffa-4"
KILL_LIMIT = "10"
GAMEYE_API_URL = "https://api.planz-development.gameye.net"
GAMEYE_IMAGE = "tin-tanks"
GAMEYE_TAG = "sha-8fc1ef62e17e"   # image tag to start; must be registered on the application
GAMEYE_LOCATION = "eu-central-1"
MAX_PLAYERS = "4"
MAX_SESSIONS = "2"      # cap on concurrently running matches this launcher will start
SESSION_TTL = "2h"

# Worker-to-worker calls on the same account must go through a service binding
# (a plain fetch to the other worker's workers.dev URL fails with error 1042).
[[services]]
binding = "MM"
service = "tin-tanks-rooms"
